buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.0.12077973"
        kotlinVersion = "2.1.20"
        // SS-DEV (2026-09-23): react-native-otp-verify `play-services-auth:+` ni oladi;
        // 21.0.0 dan boshlab `Auth.GOOGLE_SIGN_IN_API` olib tashlangan -> compile xato
        // ("cannot find symbol GOOGLE_SIGN_IN_API"). Oxirgi mos versiyaga qadaymiz.
        googlePlayServicesVersion = "20.7.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath('com.google.gms:google-services:4.4.4')
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'
    }
}
ext {
    ndkVersion = ndkVersion
}
allprojects {
    repositories {
        maven { url "https://artifactory.aigroup.uz:443/artifactory/myid" }
    }
}

apply plugin: "com.facebook.react.rootproject"
